{% extends "base.html" %}

{% block content %}

    {% if listings %}

        {% for listing in listings %}

            <li>

                <a href="{% url 'listing:detail_page' listing.id %}">{{listing.title}}</a>
                

            </li>
            
        {% endfor %}

    {% else %}
        
        <center><h3>شما آگهی ثبت شده ندارید</h3></center>

    {% endif %}

    <a href="{% url 'listing:create_listing' %}">ثبت آگهی جدید</a>

{% endblock content %}
